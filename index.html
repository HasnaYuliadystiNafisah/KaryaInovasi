<style>

.c0{background:#CFE1FF}.c1{background:#FFD3E3}.c2{background:#FFEC9E}.c3{background:#BDEFD5}
.opt.right{outline:6px solid var(--g);transform:scale(1.03)}.opt.bad{opacity:.65;filter:grayscale(.6);text-decoration:line-through}.opt:hover:not(:disabled){transform:translateY(-3px)}
.fb{font:600 22px Fredoka,sans-serif;margin:14px 0}.mat p{font-size:21px;margin:0 0 12px}.big{font-size:60px;text-align:center}
.chk{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;font:600 22px Fredoka,sans-serif;padding:12px 16px;border:2px solid #14213D55;border-radius:16px;background:var(--y);color:#14213D;margin:14px 0}
.ed{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}.ed .side button{display:block;width:100%;text-align:left;margin:0 0 8px}

.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.seq{padding-left:30px;font:600 22px Fredoka,sans-serif;margin:8px 0}

.one{max-width:520px;margin:0 auto}.hp{font-size:22px;margin-left:8px}.ft{text-align:center;margin-top:30px}

.gb{display:block;text-align:left;cursor:pointer;background:#fff;color:var(--tx);border:2px solid var(--ln);border-radius:22px;box-shadow:0 6px 18px rgba(31,95,224,.12);padding:16px;font:inherit}.gb b{font-size:42px;display:block}.gb h3{font-size:22px;margin:4px 0}.gb p{margin:0;font-size:16px;color:var(--mu)}.gb:hover{transform:translateY(-3px)}

.tray{padding:6px 0}.clue{background:#FFEC9E;color:#14213D;border:2px solid #14213D44;border-radius:14px;padding:8px 12px;margin:8px 0}

.vid{position:relative;padding-top:56.25%;border:2px solid var(--ln);border-radius:14px;overflow:hidden;background:#14213D}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.qimg{text-align:center;margin:8px 0 14px}

.rcs{--av:clamp(48px,7vw,68px);margin-top:calc(var(--av)/2 + 14px);row-gap:calc(var(--av)/2 + 22px)}
.rc{padding-top:calc(var(--av)/2 + 14px)}
.rc .rcb{width:var(--av);height:var(--av);top:calc(var(--av)/-2);font-size:calc(var(--av)*.55);border-width:3px}
.stuh .av{width:clamp(44px,9vw,64px);height:clamp(44px,9vw,64px);font-size:clamp(24px,5vw,36px)}.stuh h2{padding-right:calc(clamp(44px,9vw,64px) + 18px)}
.upl{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:var(--y);color:#14213D;border-radius:99px;padding:8px 16px;font:600 16px Fredoka,sans-serif;box-shadow:0 3px 0 #B98A00;min-height:44px}
.upl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;min-height:0;cursor:pointer}
.upl:focus-within{outline:4px solid var(--v);outline-offset:3px}
.phth{width:96px;height:96px;object-fit:cover;border-radius:14px;border:3px solid var(--ln);background:#fff}.ph0{display:grid;place-items:center;font-size:44px;background:var(--bg2)}
.phrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.phi{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:8px 0}.phi input,.phi .btn{margin:0}
.lbi{display:grid;grid-template-columns:112px 1fr;gap:12px;border:2px dashed var(--ln);border-radius:16px;padding:10px;margin-bottom:12px}
.lbph{display:flex;flex-direction:column;gap:6px;align-items:center}.lbph .btn{margin:0;padding:6px 12px;font-size:15px;min-height:0}
.lbf{display:grid;grid-template-columns:70px 1fr;gap:6px 8px;align-content:start}.lbf input,.lbf select,.lbf .btn{margin:0}.lbf>*:nth-child(n+3){grid-column:1/-1}
.qph{display:block;max-width:100%;max-height:340px;margin:0 auto;border-radius:16px;border:3px solid var(--ln);background:#fff;object-fit:contain}
.mfig{margin:0;background:#fff;border:2px solid var(--ln);border-radius:16px;padding:8px;text-align:center;flex:1 1 220px;max-width:340px}.mfig img{width:100%;max-height:260px;object-fit:contain;border-radius:10px}.mfig figcaption{font:600 16px Fredoka,sans-serif;margin-top:6px}
.clue .qph{margin-top:8px;max-height:220px}
@media(max-width:760px){.rcs{--av:56px}.hero{border-radius:24px}.rc h2{font-size:23px}.top{padding:10px 12px}.lbi{grid-template-columns:1fr}.phi{grid-template-columns:72px 1fr}.phi .btn{grid-column:1/-1}.phth{width:72px;height:72px}}
@media(max-width:420px){.rcs{--av:48px}.btn{font-size:17px;padding:8px 16px}.logo{font-size:24px;min-width:0}.logo small{display:none}}

.phld{display:inline-grid;place-items:center;background:var(--bg2);border:2px dashed var(--ln);border-radius:10px;font:600 12px Fredoka,sans-serif;color:var(--mu);text-align:center;vertical-align:middle}
.lab img.ic{border-radius:12px}

.msl{list-style:none;padding:0;margin:10px 0}.msl li{padding:10px 12px;border-radius:12px;margin:6px 0;border:2px solid var(--ln);background:var(--bg2)}
.msl li.ms-n{border-color:#FF9F1C;background:rgba(255,159,28,.16)}.msl li.ms-d{opacity:.85}.msl p{margin:6px 0}

.pbn{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}.pbn div{background:#fff;border:3px solid #1E1B4B;border-radius:16px;padding:10px 8px;width:116px;text-align:center;box-shadow:0 4px 0 #1E1B4B}.pbn .pe{font-size:54px;line-height:1.1}.pbn small{display:block;font-weight:700}
.phero{font-size:64px;text-align:center;letter-spacing:8px;margin:6px 0}

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script id="data" type="application/json">{"L": [{"t": "Mengenal Sistem Komputer", "m": "Komputer adalah mesin elektronik yang menerima data, mengolahnya, menyimpannya, lalu menampilkan hasilnya. Sebuah sistem komputer punya tiga unsur: perangkat keras (hardware), perangkat lunak (software), dan pengguna (brainware).\n\nHardware adalah komponen fisik yang bisa dilihat dan disentuh, misalnya Keyboard, Mouse, Monitor, dan CPU. Software adalah program atau instruksi yang tidak berwujud fisik, misalnya sistem operasi Windows, peramban Chrome, dan aplikasi Word. Brainware adalah manusia yang mengoperasikan komputer.\n\nHardware tanpa software ibarat tubuh tanpa pikiran: ia ada, tetapi tidak tahu harus berbuat apa. Sebaliknya, software butuh hardware untuk dijalankan. Karena itu keduanya selalu bekerja sama.\n\nHardware dikelompokkan menjadi empat peran: perangkat input (memasukkan data), proses (mengolah data), penyimpanan (menyimpan data), dan output (menampilkan hasil). Keempatnya kamu pelajari di level-level berikutnya.", "v": "https://www.youtube.com/results?search_query=pengenalan+hardware+komputer+informatika+kelas+7", "min": 8, "k": "", "w": "hardware,software,brainware", "p": {"ty": "sort", "c": ["Hardware", "Software", "Brainware"], "i": [["Keyboard", 0], ["Monitor", 0], ["Mouse", 0], ["Aplikasi Word", 1], ["Windows", 1], ["Game", 1], ["Operator komputer", 2], ["Programmer", 2], ["Teknisi komputer", 2]], "h": "Pilah unsur sistem komputer: hardware, software, atau brainware?"}, "q": [{"q": "Tiga unsur sistem komputer adalah…", "o": ["Hardware, software, brainware", "Input, proses, output", "CPU, RAM, SSD", "Monitor, keyboard, mouse"], "a": 0, "e": "Sistem komputer = perangkat keras, perangkat lunak, dan pengguna (brainware)."}, {"q": "Teknisi yang memperbaiki komputer termasuk unsur…", "o": ["Hardware", "Software", "Brainware", "Output"], "a": 2, "e": "Brainware adalah manusia yang mengoperasikan atau merawat komputer."}, {"q": "Rina menginstal game baru di laptopnya, lalu menyentuh layar laptop untuk menunjuk. Mana software dan mana hardware?", "o": ["Game = software, layar = hardware", "Game = hardware, layar = software", "Keduanya software", "Keduanya hardware"], "a": 0, "e": "Game adalah program (software). Layar adalah benda fisik (hardware)."}]}, {"t": "Perangkat Input", "m": "Perangkat input adalah hardware yang memasukkan data atau perintah dari manusia ke komputer.\n\nKeyboard memasukkan teks, angka, dan perintah lewat tombol. Susunan huruf yang paling umum disebut QWERTY. Mouse menggerakkan penunjuk di layar; mouse optik membaca gerakan memakai cahaya sehingga tidak perlu bola karet. Pada laptop, fungsi mouse digantikan oleh touchpad.\n\nMikrofon mengubah suara menjadi sinyal listrik untuk rekaman atau panggilan video. Webcam menangkap gambar bergerak untuk rapat daring. Scanner membaca dokumen atau foto di kertas lalu mengubahnya menjadi data digital. Joystick atau gamepad dipakai untuk mengendalikan permainan.\n\nTahukah kamu? Layar sentuh adalah perangkat input sekaligus output: ia menerima sentuhan jarimu dan menampilkan gambar.", "v": "https://www.youtube.com/results?search_query=perangkat+input+komputer+fungsi+dan+contoh", "min": 8, "k": "", "w": "input,masuk", "p": {"ty": "sort", "c": ["Input", "Bukan input"], "i": [["Keyboard", 0], ["Mouse", 0], ["Mikrofon", 0], ["Webcam", 0], ["Printer", 1], ["Speaker", 1], ["Monitor", 1], ["Scanner", 0], ["Joystick", 0], ["Proyektor", 1], ["SSD", 1]], "h": "Mana yang memasukkan data ke komputer?"}, "q": [{"q": "Perangkat untuk memasukkan suara ke komputer adalah…", "o": ["Speaker", "Mikrofon", "Printer", "Monitor"], "a": 1, "e": "Mikrofon menangkap suara lalu mengirimnya ke komputer."}, {"q": "Scanner mengubah dokumen kertas menjadi data digital. Scanner termasuk perangkat…", "o": ["Input", "Output", "Penyimpanan", "Proses"], "a": 0, "e": "Scanner memasukkan data ke komputer, jadi ia input."}, {"q": "Kamu ingin merekam suara dan wajahmu untuk membuat vlog. Pasangan perangkat input yang tepat adalah…", "o": ["Mikrofon dan webcam", "Speaker dan monitor", "Printer dan proyektor", "SSD dan RAM"], "a": 0, "e": "Mikrofon menangkap suara dan webcam menangkap gambar, keduanya memasukkan data."}]}, {"t": "Perangkat Proses", "m": "Perangkat proses adalah pusat kerja komputer. Di sinilah data diolah menjadi informasi.\n\nCPU (Central Processing Unit) atau prosesor adalah otak komputer. Ia menjalankan instruksi program. Kecepatannya diukur dalam GHz, dan prosesor modern punya banyak inti (core) sehingga bisa mengerjakan beberapa tugas sekaligus.\n\nRAM (Random Access Memory) adalah memori sementara. Data dan program yang sedang dipakai ditaruh di RAM supaya CPU bisa mengambilnya dengan cepat. Isi RAM hilang saat listrik mati. Kapasitasnya diukur dalam GB; semakin besar RAM, semakin lancar membuka banyak aplikasi.\n\nGPU (Graphics Processing Unit) atau kartu grafis khusus mengolah gambar, video, dan permainan. Semua komponen ini dipasang pada Motherboard dan perlu pendingin agar tidak terlalu panas.\n\nAnalogi: CPU adalah koki, RAM adalah meja dapur tempat bahan ditaruh selama memasak, dan SSD adalah lemari penyimpanan bahan.", "v": "https://www.youtube.com/results?search_query=fungsi+CPU+RAM+GPU+komputer+perangkat+proses", "min": 8, "k": "", "w": "cpu,ram", "p": {"ty": "sort", "c": ["CPU", "RAM"], "i": [["Otak komputer", 0], ["Mengolah data", 0], ["Memori sementara", 1], ["Isi hilang saat mati", 1], ["Menyimpan data yang sedang dipakai", 1], ["Menjalankan perintah", 0]], "h": "Tugas siapa: CPU atau RAM?"}, "q": [{"q": "Bagian yang disebut otak komputer adalah…", "o": ["RAM", "CPU", "Mouse", "Speaker"], "a": 1, "e": "CPU mengolah semua data dan perintah."}, {"q": "Saat komputer dimatikan, isi RAM akan…", "o": ["Tersimpan selamanya", "Hilang", "Bertambah", "Dicetak"], "a": 1, "e": "RAM hanya menyimpan data sementara."}, {"q": "Komputer Dito sering macet saat membuka banyak tab, tetapi file-filenya aman. Penyebab paling mungkin…", "o": ["RAM berkapasitas kecil", "Speaker rusak", "Mouse lambat", "Kabel monitor longgar"], "a": 0, "e": "RAM yang sempit membuat kerja berat terasa macet, sementara file ada di penyimpanan."}]}, {"t": "Perangkat Output", "m": "Perangkat output menampilkan atau mengeluarkan hasil kerja komputer agar bisa dilihat, didengar, atau dipegang.\n\nMonitor menampilkan gambar. Ketajamannya ditentukan resolusi, misalnya Full HD 1920 x 1080 piksel. Speaker dan Headphone mengeluarkan suara. Printer mencetak ke kertas: printer inkjet menyemprotkan tinta, sedangkan printer laser memakai serbuk toner dan cocok untuk cetak banyak. Proyektor memantulkan gambar layar ke dinding atau layar besar sehingga satu kelas bisa melihat bersama.\n\nPerangkat output dibedakan menjadi tiga jenis hasil: tampilan (soft copy) di layar, cetakan (hard copy) di kertas, dan suara (audio).", "v": "https://www.youtube.com/results?search_query=perangkat+output+komputer+monitor+printer+speaker+proyektor", "min": 8, "k": "", "w": "output,tampil,keluar", "p": {"ty": "sort", "c": ["Output", "Bukan output"], "i": [["Monitor", 0], ["Speaker", 0], ["Printer", 0], ["Proyektor", 0], ["Keyboard", 1], ["Mouse", 1], ["Mikrofon", 1], ["Headphone", 0], ["Scanner", 1], ["Webcam", 1], ["Joystick", 1]], "h": "Mana yang menampilkan hasil kerja komputer?"}, "q": [{"q": "Dokumen dicetak ke kertas memakai…", "o": ["Scanner", "Printer", "Mouse", "Webcam"], "a": 1, "e": "Printer mengubah data digital menjadi cetakan."}, {"q": "Monitor dan speaker sama-sama perangkat…", "o": ["Input", "Proses", "Penyimpanan", "Output"], "a": 3, "e": "Keduanya mengeluarkan hasil kerja komputer."}, {"q": "Guru ingin memutar video lengkap dengan suara untuk satu kelas. Perangkat output yang dibutuhkan…", "o": ["Proyektor dan speaker", "Keyboard dan mouse", "Scanner dan webcam", "Flashdisk dan SSD"], "a": 0, "e": "Proyektor menampilkan gambar, speaker mengeluarkan suara."}]}, {"t": "Perangkat Penyimpanan", "m": "Perangkat penyimpanan menjaga data tetap ada walaupun komputer dimatikan. Inilah perbedaannya dengan RAM yang hanya menyimpan data sementara.\n\nHarddisk (HDD) menyimpan data di piringan magnetik yang berputar. Kapasitasnya besar dan harganya murah, tetapi lebih lambat dan tidak tahan guncangan. SSD (Solid State Drive) memakai chip memori tanpa bagian bergerak sehingga jauh lebih cepat, senyap, dan tahan banting. Flashdisk dan Kartu memori adalah penyimpanan kecil yang mudah dibawa untuk memindahkan file.\n\nSatuan ukuran data: 1 byte, 1 KB = 1024 byte, 1 MB = 1024 KB, 1 GB = 1024 MB, 1 TB = 1024 GB. Satu foto biasanya beberapa MB, satu film bisa beberapa GB.\n\nSelain di perangkat, data juga bisa disimpan di cloud (penyimpanan daring), misalnya Google Drive. Tetap buat cadangan (backup) file penting.", "v": "https://www.youtube.com/results?search_query=perangkat+penyimpanan+komputer+SSD+harddisk+flashdisk", "min": 8, "k": "", "w": "simpan,ssd,harddisk", "p": {"ty": "sort", "c": ["Penyimpanan", "Bukan penyimpanan"], "i": [["SSD", 0], ["Harddisk", 0], ["Flashdisk", 0], ["Kartu memori", 0], ["CPU", 1], ["Monitor", 1], ["Speaker", 1], ["RAM", 1], ["Mouse", 1], ["Webcam", 1]], "h": "Mana yang menyimpan data agar tidak hilang?"}, "q": [{"q": "Tugasmu harus tetap ada setelah komputer mati. Simpan di…", "o": ["RAM", "SSD atau flashdisk", "Monitor", "Speaker"], "a": 1, "e": "Hanya penyimpanan yang menjaga data saat listrik mati."}, {"q": "Penyimpanan yang umumnya lebih cepat adalah…", "o": ["Harddisk lama", "SSD", "Disket", "Kertas"], "a": 1, "e": "SSD tidak punya bagian berputar, jadi lebih cepat."}, {"q": "Ani mengetik laporan 2 jam, lalu listrik padam sebelum ia menyimpan. Mengapa laporannya hilang?", "o": ["Data masih di RAM dan belum dipindah ke penyimpanan", "Monitor rusak", "Keyboard macet", "Printer kehabisan tinta"], "a": 0, "e": "RAM kehilangan isinya saat listrik mati. Simpan file berkala ke SSD atau harddisk."}]}, {"t": "Perangkat Lunak (Software)", "m": "Software adalah kumpulan instruksi atau program yang memerintahkan hardware bekerja. Software tidak bisa disentuh, tetapi tanpanya komputer hanyalah kotak yang diam.\n\nSoftware dibagi tiga jenis. Sistem operasi (OS) mengatur seluruh hardware dan menjalankan aplikasi; contohnya Windows, Linux, macOS, dan Android. Aplikasi dipakai pengguna untuk tugas tertentu: Microsoft Word untuk mengetik, Excel untuk menghitung, Google Chrome untuk menjelajah web, Canva untuk desain, dan permainan. Utilitas membantu merawat komputer, misalnya antivirus, WinRAR untuk mengompres file, dan pembersih disk.\n\nDriver adalah program kecil yang membuat sistem operasi mengenali hardware seperti printer atau kartu grafis. Software perlu diperbarui (update) agar lebih aman dan bebas kesalahan.\n\nDari sisi lisensi, software ada yang berbayar, gratis (freeware), dan sumber terbuka (open source) seperti Linux dan LibreOffice. Gunakan software asli atau legal.", "v": "https://www.youtube.com/results?search_query=jenis+software+sistem+operasi+aplikasi+utilitas+informatika+kelas+7", "min": 8, "k": "", "w": "software,sistem operasi,aplikasi", "p": {"ty": "sort", "c": ["Sistem operasi", "Aplikasi", "Utilitas"], "i": [["Windows", 0], ["Linux", 0], ["Android", 0], ["Aplikasi Word", 1], ["Google Chrome", 1], ["Game", 1], ["Canva", 1], ["Antivirus", 2], ["WinRAR", 2], ["Pembersih disk", 2]], "h": "Kelompokkan software ke jenisnya: sistem operasi, aplikasi, atau utilitas."}, "q": [{"q": "Software yang mengatur seluruh hardware dan menjalankan aplikasi disebut…", "o": ["Sistem operasi", "Antivirus", "Printer", "RAM"], "a": 0, "e": "Sistem operasi adalah pengatur utama hardware dan aplikasi."}, {"q": "Antivirus dan WinRAR termasuk software…", "o": ["Utilitas", "Sistem operasi", "Hardware", "Brainware"], "a": 0, "e": "Utilitas membantu merawat dan memudahkan penggunaan komputer."}, {"q": "Printer baru tidak terdeteksi Windows walau kabel terpasang benar. Yang perlu dipasang adalah…", "o": ["Driver printer", "Game baru", "Kartu grafis", "Speaker"], "a": 0, "e": "Driver menghubungkan sistem operasi dengan hardware."}]}, {"t": "Alur Kerja Sistem Komputer", "m": "Semua pekerjaan komputer mengikuti satu alur: Input, Proses, Simpan, Output.\n\nContoh mengerjakan tugas: kamu mengetik laporan lewat Keyboard (input). CPU dan RAM mengolah ketikanmu menjadi dokumen (proses). Kamu menekan Ctrl+S dan file masuk ke SSD (simpan). Terakhir, dokumen tampil di Monitor atau dicetak Printer (output).\n\nAlur ini berlaku di mana saja. Pada ponsel: layar sentuh dan kamera sebagai input, prosesor sebagai proses, memori internal sebagai penyimpan, layar dan speaker sebagai output. Jika salah satu tahap rusak, kerja komputer terganggu, misalnya tanpa penyimpanan semua data hilang saat dimatikan.", "v": "https://www.youtube.com/results?search_query=cara+kerja+komputer+input+proses+output+penyimpanan", "min": 10, "k": "", "w": "input,proses,simpan,output", "p": {"ty": "order", "i": ["Input: mengetik tugas", "Proses: komputer mengolah data", "Simpan: file disimpan di SSD", "Output: tugas dicetak"], "h": "Susun alur kerja komputer dari awal sampai akhir. Ketuk sesuai urutan."}, "q": [{"q": "Urutan alur kerja yang benar adalah…", "o": ["Output → Input → Proses → Simpan", "Input → Proses → Simpan → Output", "Simpan → Output → Input → Proses", "Proses → Input → Output → Simpan"], "a": 1, "e": "Data masuk, diolah, disimpan, lalu hasilnya keluar."}, {"q": "Kamu mengetik di keyboard. Itu tahap…", "o": ["Input", "Proses", "Simpan", "Output"], "a": 0, "e": "Mengetik memasukkan data ke komputer."}, {"q": "Hana memotret tugas dengan webcam, mengedit fotonya, menyimpannya di SSD, lalu menampilkannya di monitor. Tahap Proses dalam cerita itu adalah…", "o": ["Memotret dengan webcam", "Mengedit foto", "Menyimpan di SSD", "Menampilkan di monitor"], "a": 1, "e": "Mengedit adalah pengolahan data, yaitu tahap Proses."}]}, {"t": "Port dan Kabel", "m": "Port adalah lubang penghubung antara komputer dan perangkat lain, sedangkan kabel membawa sinyal atau daya melalui port itu.\n\nUSB adalah port serbaguna untuk flashdisk, mouse, keyboard, dan pengisi daya; bentuknya ada USB-A (persegi panjang) dan USB-C (kecil dan simetris). HDMI membawa gambar dan suara digital ke monitor, TV, atau proyektor. VGA adalah port layar lama berwarna biru dengan 15 lubang. Jack audio 3,5 mm untuk headset atau speaker. Port LAN (RJ-45) menyambungkan kabel jaringan internet.\n\nSebagian perangkat tersambung tanpa kabel lewat Bluetooth (jarak dekat, misalnya mouse dan headset) atau Wi-Fi (jaringan internet). Selalu cocokkan bentuk colokan dengan portnya dan jangan memaksa memasang.", "v": "https://www.youtube.com/results?search_query=port+dan+kabel+komputer+USB+HDMI+jack+audio", "min": 8, "k": "", "w": "port,usb,hdmi", "p": {"ty": "sort", "c": ["HDMI", "USB", "Jack audio"], "i": [["Proyektor", 0], ["Flashdisk", 1], ["Headset", 2], ["Mouse", 1], ["Layar TV", 0], ["Earphone", 2]], "h": "Sambungkan perangkat ke port yang tepat."}, "q": [{"q": "Menyambungkan laptop ke proyektor biasanya memakai port…", "o": ["HDMI", "Jack audio", "Slot SIM", "Slot SD"], "a": 0, "e": "HDMI mengirim gambar dan suara ke layar."}, {"q": "Flashdisk dicolokkan ke port…", "o": ["HDMI", "USB", "Jack audio", "Slot baterai"], "a": 1, "e": "USB adalah port serbaguna untuk banyak perangkat."}, {"q": "Kamu ingin memutar film dari laptop ke TV besar dengan gambar dan suara lewat satu kabel. Port yang cocok…", "o": ["HDMI", "Jack audio saja", "Port baterai", "Slot SD"], "a": 0, "e": "HDMI membawa gambar dan suara sekaligus."}]}, {"t": "Motherboard dan Komponennya", "m": "Motherboard adalah papan sirkuit utama yang menghubungkan semua komponen komputer. Tanpanya, CPU, RAM, dan SSD tidak bisa berkomunikasi.\n\nBagian utamanya: soket CPU tempat prosesor dipasang; slot RAM (DIMM) untuk modul memori; slot PCIe untuk kartu grafis; slot M.2 dan konektor SATA untuk SSD atau harddisk; chipset sebagai pengatur lalu lintas data; Baterai CMOS (CR2032) yang menjaga jam dan pengaturan dasar; konektor daya dari PSU (24-pin); dan port belakang untuk Keyboard, Mouse, dan Monitor.\n\nKomponen pendamping: PSU (power supply) mengubah listrik rumah menjadi tegangan aman untuk komponen, Kipas pendingin dan heatsink membuang panas CPU, dan Casing melindungi semuanya. Motherboard punya ukuran standar seperti ATX dan Micro-ATX.", "v": "https://www.youtube.com/results?search_query=motherboard+komponen+dan+fungsinya", "min": 10, "k": "", "w": "motherboard,slot,komponen", "p": {"ty": "sort", "c": ["Soket CPU", "Slot RAM", "Slot PCIe", "Slot M.2 / SATA", "Chipset", "Konektor daya", "Baterai CMOS", "Port belakang"], "i": [["Processor (CPU)", 0], ["Modul RAM", 1], ["Kartu grafis (GPU)", 2], ["SSD NVMe", 3], ["Harddisk SATA", 3], ["Pengatur komunikasi antarkomponen", 4], ["Kabel daya dari PSU", 5], ["Baterai kancing", 6], ["Mouse dan USB", 7]], "h": "Pasang tiap komponen ke tempat yang tepat di motherboard. Seret komponen ke slotnya.", "mb": 1}, "q": [{"q": "Papan sirkuit utama yang menghubungkan semua komponen komputer disebut…", "o": ["Motherboard", "Speaker", "Printer", "Flashdisk"], "a": 0, "e": "Motherboard menjadi tempat semua komponen terhubung dan saling berkomunikasi."}, {"q": "Modul RAM dipasang pada…", "o": ["Soket CPU", "Slot RAM", "Port audio", "Konektor kipas"], "a": 1, "e": "Slot RAM (DIMM) dibuat khusus untuk modul memori."}, {"q": "Komputer Doni selalu lupa tanggal dan jam setelah lama dimatikan. Komponen di motherboard yang paling mungkin lemah adalah…", "o": ["Slot RAM", "Baterai CMOS", "Soket CPU", "Port HDMI"], "a": 1, "e": "Baterai CMOS menjaga jam dan pengaturan dasar saat komputer mati."}]}, {"t": "Misi Akhir: Merawat dan Troubleshooting", "m": "Hardware yang dirawat awet lebih lama dan jarang rusak.\n\nBersihkan debu secara berkala memakai kuas lembut, kain kering, atau blower setelah komputer dimatikan dan kabel dicabut. Debu menutup kipas dan membuat komputer panas. Jangan makan atau minum dekat Keyboard karena cairan merusak rangkaian. Beri ruang udara di sekitar komputer dan jangan menutup lubang ventilasi laptop.\n\nSebelum menyentuh komponen di dalam casing, sentuh dulu logam casing untuk membuang listrik statis (ESD) yang bisa merusak chip. Matikan komputer lewat menu Shut down, bukan dengan mencabut kabel, supaya data tersimpan dengan aman. Gunakan stabilizer atau stop kontak yang baik untuk melindungi dari lonjakan listrik.\n\nTroubleshooting adalah cara berpikir sistematis untuk menemukan dan memperbaiki masalah.\n\nLangkahnya: (1) Kenali gejala, apa yang terjadi dan sejak kapan. (2) Cek hal paling sederhana: kabel listrik, kabel monitor, tombol power, baterai. (3) Restart komputer. (4) Persempit penyebab: ganti kabel atau coba perangkat lain untuk memastikan mana yang rusak. (5) Cari bantuan atau ganti komponen. (6) Catat masalah dan solusinya.\n\nContoh gejala: layar hitam tetapi kipas berputar (cek kabel monitor), komputer lambat saat banyak aplikasi (RAM kurang), laptop panas dan kipas bising (debu atau pasta termal kering), komputer berbunyi bip saat menyala (ada komponen seperti RAM yang tidak terpasang rapat). Jangan langsung menginstal ulang atau membeli komponen baru sebelum mengecek yang mudah.", "v": "https://www.youtube.com/results?search_query=troubleshooting+komputer+dan+cara+merawat+hardware", "min": 12, "k": "", "w": "kabel,restart,cek,rawat", "p": {"ty": "order", "i": ["Cek kabel dan sambungan", "Pastikan listrik menyala", "Restart komputer", "Cari penyebab lain atau minta bantuan"], "h": "Urutkan langkah troubleshooting dari yang paling mudah."}, "q": [{"q": "Layar hitam tetapi kipas komputer berputar. Dicek pertama…", "o": ["Kabel monitor", "Instal ulang Windows", "Ganti CPU", "Beli RAM baru"], "a": 0, "e": "Kabel longgar adalah penyebab paling sering dan paling mudah dicek."}, {"q": "Komputer lambat saat banyak aplikasi dibuka. Yang mungkin kurang…", "o": ["RAM", "Speaker", "Webcam", "Mouse"], "a": 0, "e": "RAM yang sempit membuat kerja komputer melambat."}, {"q": "Cara yang benar mematikan komputer adalah…", "o": ["Mencabut kabel listrik", "Memilih Shut down", "Menekan tombol berkali-kali", "Menutup monitor"], "a": 1, "e": "Shut down menutup program dan menyimpan data dengan aman."}]}], "sj": "Pelajari sistem komputer: hardware, software, dan brainware lewat video, materi, foto asli, dan permainan seret-lepas. Selesaikan satu level dengan benar untuk membuka level berikutnya.", "mp": "Informatika · Sistem Komputer (Hardware dan Software)", "lab": {"ti": "🎮 Lab Rakit Hardware", "ds": "Seret foto perangkat ke kategori fungsinya. Di layar sentuh, geser dengan jari atau ketuk foto lalu ketuk kategorinya. Ada 30 hardware dalam 6 kategori.", "b": [["⌨️", "Input"], ["🧠", "Proses"], ["💾", "Penyimpanan"], ["🖥️", "Output"], ["🔌", "Port dan Kabel"], ["🧰", "Pendukung"]], "i": [["Keyboard", 0, "Memasukkan teks dan perintah lewat tombol.", "", ""], ["Mouse", 0, "Menunjuk dan mengklik di layar.", "", ""], ["Mikrofon", 0, "Memasukkan suara ke komputer.", "", ""], ["Webcam", 0, "Memasukkan gambar bergerak.", "", ""], ["Scanner", 0, "Mengubah dokumen kertas menjadi data digital.", "", ""], ["Joystick", 0, "Mengendalikan permainan.", "", ""], ["Touchpad", 0, "Pengganti mouse pada laptop.", "", ""], ["CPU", 1, "Otak komputer yang mengolah data.", "", ""], ["RAM", 1, "Memori sementara tempat data diolah.", "", ""], ["GPU", 1, "Mengolah gambar dan grafis.", "", ""], ["Motherboard", 1, "Papan utama tempat semua komponen terhubung.", "", ""], ["SSD", 2, "Penyimpanan permanen yang cepat.", "", ""], ["Harddisk", 2, "Penyimpanan besar di piringan berputar.", "", ""], ["Flashdisk", 2, "Penyimpanan kecil yang mudah dibawa.", "", ""], ["Kartu memori", 2, "Penyimpanan untuk kamera dan HP.", "", ""], ["DVD", 2, "Cakram optik untuk menyimpan data.", "", ""], ["Monitor", 3, "Menampilkan gambar hasil kerja.", "", ""], ["Speaker", 3, "Mengeluarkan suara.", "", ""], ["Printer", 3, "Mencetak hasil ke kertas.", "", ""], ["Proyektor", 3, "Menampilkan layar ke dinding.", "", ""], ["Headphone" naik turun, jadi catu daya harus stabil."]], "q": "Perangkat input apa yang paling mempercepat kasir?", "o": ["Joystick", "Scanner barcode", "Proyektor", "Kartu grafis"], "a": 1, "e": "Scanner barcode memasukkan data barang tanpa mengetik, sehingga antrean cepat.", "f": ["Pasang scanner ke port USB", "Pasang printer struk dan kabel dayanya", "Instal driver scanner dan printer", "Uji dengan satu barang", "Gunakan untuk transaksi sebenarnya"]}, {"t": "Lab Komputer SMP Krian", "s": "SMP di Krian menyiapkan lab untuk 30 siswa. Guru ingin menjelaskan dari laptop ke layar besar, lengkap dengan suara video.", "p": [["Proyektor", "Layar kelas besar, bisa dilihat dari barisan belakang."], ["HDMI", "Satu kabel membawa gambar dan suara sekaligus."], ["Speaker", "Suara video harus terdengar sampai belakang kelas."], ["Kipas pendingin", "Ruangan panas dan PC menyala 6 jam per hari."]], "q": "Kabel apa yang tepat untuk menyambungkan laptop ke proyektor dengan gambar dan suara?", "o": ["VGA saja", "HDMI", "Jack audio saja", "LAN"], "a": 1, "e": "HDMI mengirim gambar dan suara lewat satu kabel.", "f": ["Matikan proyektor dan laptop", "Sambungkan kabel HDMI ke kedua perangkat", "Nyalakan proyektor lalu laptop", "Pilih sumber HDMI di proyektor", "Atur volume speaker"]}, {"t": "Kreator Konten Batik", "s": "Dinda mengedit video proses membatik di Pekalongan. Laptopnya sering macet dan hasil render lama sekali.", "p": [["GPU", "Efek dan render video dikerjakan kartu grafis."], ["RAM", "Aplikasi editing butuh RAM 16 GB atau lebih."], ["SSD", "File video berukuran besar harus dibuka dengan cepat."], ["Monitor", "Warna batik harus akurat saat diedit."]], "q": "Mengapa Dinda butuh GPU dan RAM yang besar?", "o": ["Mengolah video berat lebih lancar", "Agar speaker lebih keras", "Agar printer lebih cepat", "Agar kabel lebih panjang"], "a": 0, "e": "Editing video adalah proses berat sehingga butuh pengolah grafis dan memori besar.", "f": ["Cek spesifikasi laptop", "Tambah RAM sesuai slot yang ada", "Pindahkan proyek ke SSD", "Perbarui driver grafis", "Render ulang video"]}, {"t": "Perpustakaan Desa Digital", "s": "Perpustakaan desa di Banyuwangi mengubah ribuan buku menjadi arsip digital. Ruangan berdebu dan lembap, dan arsip tidak boleh hilang.", "p": [["Scanner", "Mengubah halaman buku menjadi file digital."], ["Harddisk", "Kapasitas besar dan murah untuk ribuan file arsip."], ["Flashdisk", "Dipakai membawa salinan arsip ke tempat lain."], ["Casing", "Casing tertutup melindungi komponen dari debu."]], "q": "Cara terbaik menjaga arsip digital tetap aman adalah…", "o": ["Menyimpan hanya di RAM", "Harddisk besar ditambah salinan cadangan", "Hanya menampilkannya di monitor", "Tanpa cadangan"], "a": 1, "e": "Simpan di penyimpanan permanen dan buat cadangan di tempat lain.", "f": ["Pindai buku dengan scanner", "Beri nama file yang rapi", "Simpan ke harddisk", "Salin cadangan ke flashdisk atau cloud", "Bersihkan debu komputer secara berkala"]}, {"t": "Kelurahan Layanan Surat", "s": "Antrean warga di Kelurahan Wonocolo, Surabaya, memanjang karena printer surat keterangan macet dan hasil cetaknya bergaris putih.", "p": [["Printer", "Lampu indikator berkedip oranye dan hasil cetak muncul garis putih."], ["Keyboard", "Petugas mengetik normal dan semua huruf muncul di layar."], ["Monitor", "Dokumen tampil rapi di layar tanpa kesalahan."], ["USB", "Kabel printer ke komputer terpasang kencang."]], "q": "Bagian mana yang paling mungkin bermasalah?", "o": ["Tinta atau head cetak printer kotor", "Keyboard rusak", "Monitor rusak", "Kabel USB putus"], "a": 0, "e": "Tampilan layar rapi dan sambungan lancar, jadi masalah ada pada hasil cetaknya.", "f": ["Matikan printer", "Periksa dan isi ulang tinta", "Jalankan pembersihan head cetak", "Cetak halaman uji", "Cetak ulang surat warga"]}, {"t": "Rental Game Pak Beni", "s": "PC nomor 7 di rental game Pak Beni, Jember, sering hang dan layar patah-patah setelah dimainkan 3 jam. Kipasnya berisik.", "p": [["GPU", "Kartu grafis cuku
